[project]
name = "psychic-fortnight"
version = "0.1.0"
description = "Agentic Engineering Memory System - Autonomous processing of engineering knowledge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["ai", "memory", "engineering", "knowledge-management", "autonomous"]

dependencies = [
    # Core Framework
    "langgraph>=0.0.20",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    
    # LLM Providers
    "ibm-watsonx-ai>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    
    # Vector Database
    "chromadb>=0.4.0",
    
    # Graph
    "networkx>=3.0",
    
    # Data Models
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    
    # UI
    "streamlit>=1.30.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
    
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
